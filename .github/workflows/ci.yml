name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit all locked dependencies
        run: npm audit --audit-level=low

      - name: Check
        run: npm run check

      - name: Test public ask
        run: npm run test:public-ask

      - name: Test related
        run: npm run test:related

      - name: Test comments
        run: npm run test:comments

      - name: Test site assets and audits
        run: npm run test:site

      - name: Test search integrity
        run: npm run test:search

      - name: Test search build gates
        run: npm run test:search-build

      - name: Build
        run: npm run build

      - name: Verify
        run: npm run verify

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/public-ask-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/public-ask-worker/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit all locked dependencies
        run: npm audit --audit-level=low

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: MCP protocol integration
        run: npm run test:mcp-protocol

      - name: Product-client record schema
        run: npm run test:product-client-records

      - name: Bundle check
        run: npm run bundle:check
