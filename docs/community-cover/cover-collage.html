<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1600" />
  <title>Refined-X Cover — Collage</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1600px;
      height: 900px;
      overflow: hidden;
      background: #ffe1bf;
    }
    .frame {
      position: relative;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      background: #ffe1bf;
    }
    .bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #ffe1bf;
    }
    .shapes {
      position: absolute;
      left: -318px;
      top: -878px;
      width: 2640.356px;
      height: 2253.335px;
    }
    .shapes img {
      position: absolute;
      inset: 0 -2.37% -19.29% -11.94%;
      width: 100%;
      height: 100%;
      max-width: none;
      display: block;
    }
    .noise {
      position: absolute;
      inset: 0;
      width: 1600px;
      height: 900px;
      object-fit: cover;
      mix-blend-mode: overlay;
      opacity: 0.45;
      pointer-events: none;
    }
    .panel {
      position: absolute;
      overflow: hidden;
      border-radius: 8px;
      box-shadow:
        0px 20px 100px rgba(0, 0, 0, 0.2),
        0px 40px 160px rgba(0, 0, 0, 0.18),
        0px 100px 240px rgba(0, 0, 0, 0.12),
        0px 200px 250px rgba(0, 0, 0, 0.04);
      background: #fff;
    }
    .panel img {
      display: block;
      width: 100%;
      height: auto;
      /* full page width visible — no side crop from object-fit:cover */
    }
    .panel-left {
      left: 60px;
      top: 40px;
      width: 720px;
      height: 1715.4px;
      z-index: 2;
    }
    .panel-right-top {
      left: 820px;
      top: -478px;
      width: 720px;
      height: 844.32px;
      z-index: 1;
    }
    .panel-right-bottom {
      left: 820px;
      top: 406px;
      width: 720px;
      height: 988.2px;
      z-index: 3;
    }
  </style>
</head>
<body>
  <div class="frame" data-screen-label="cover-collage">
    <div class="bg">
      <div class="shapes">
        <img src="source/bg-peach/shapes.svg" alt="" />
      </div>
      <img class="noise" src="source/bg-peach/noise.png" alt="" />
    </div>

    <div class="panel panel-left">
      <img src="source/shots/01-home-light-full.png" alt="Home" />
    </div>
    <div class="panel panel-right-top">
      <img src="source/shots/03-writing-light-full.png" alt="Writing" />
    </div>
    <div class="panel panel-right-bottom">
      <img src="source/shots/05-about-light-full.png" alt="About" />
    </div>
  </div>
</body>
</html>
